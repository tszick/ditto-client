name: Client Matrix CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  contract-spec:
    name: Contract Spec Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate release manifest
        run: python scripts/validate_release_manifest.py
      - name: Validate client security policy
        run: python scripts/validate_client_security_policy.py
      - name: Validate contract specs
        run: python contracts/validate_contracts.py

  nodejs:
    name: Node.js Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ditto-nodejs-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25"
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Contract Runtime + SDK Tests
        run: npm run test:integration

  go:
    name: Go Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ditto-go-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
      - name: Test
        run: go test ./...

  python:
    name: Python Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ditto-python-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile check
        run: python -m compileall src
      - name: Contract Runtime + SDK Tests
        run: python -m unittest discover -s tests -v

  java:
    name: Java Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ditto-java-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test
        run: ./gradlew test --no-daemon

  rust:
    name: Rust Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ditto-rust-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ditto-rust-client
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
